[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "morrow-runtime"
version = "0.1.0"
description = "Morrows execution-plane runtime, forked from Local Shell MCP for Morrows-managed workers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.27.0,<2",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "PyYAML>=6.0.1",
  "PyJWT>=2.8.0",
  "httpx>=0.27.0",
  "h2>=4.1.0",
  "aiofiles>=23.2.1",
  "python-multipart>=0.0.9",
  "pathspec>=0.12.1",
  "zstandard>=0.23.0,<1",
  "pillow>=10.3.0",
  "playwright>=1.44.0",
  "pywinpty>=2.0.13; platform_system == \"Windows\"",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.8.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
morrow-runtime = "morrow_runtime.main:main"
morrow-runtime-worker = "morrow_runtime.remote_worker_cli:run_worker_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/morrow_runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
